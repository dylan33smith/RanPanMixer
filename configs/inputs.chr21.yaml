# Input manifest — chr21
#
# Everything the preprocessing pipeline starts from. Three inputs and no more:
# the graph, a genetic map, and a target. Under model C the mechanism uses no
# external panel and no PanGenie callset at all.
#
# Paths are relative to the branch root. data/ is a symlink to
# /data/ds85/RanPanMixer/data and is gitignored — the inputs are 435 MB.

chrom: chr21

# External binaries this pipeline shells out to. Pinned here so a version change is
# visible rather than silent -- vg 1.68 and vg 1.36 order ALT alleles differently at
# multi-allelic sites, so the version determines the allele indices.
tools:
  vg:
    path: data/tools/vg           # override with $RANPANMIXER_VG
    version: v1.68.0
    sha256: 008a4bf376674e2720a21cf9c6ab94a65d98a91a2106925ecdda5fbed9a36610
    note: >
      A third-party binary, kept under OUR data tree rather than inside PanMixer's
      checkout so the pipeline has no path dependency on their tool.
  bcftools:
    version: "1.24"
    from: the ranpanmixer conda env (environment.yml)

inputs:

  graph:
    path: data/raw/chr21.hprc-v1.0-pggb.gfa.gz
    url: https://s3-us-west-2.amazonaws.com/human-pangenomics/pangenomes/freeze/freeze1/pggb/chroms/chr21.hprc-v1.0-pggb.gfa.gz
    bytes: 434772428
    sha256: 85222d4fee4af880930b43f8a98c004c44530d7eca7004908cb40e5196567977
    acquired: 2026-09-29
    what: >
      HPRC v1.0 PGGB graph, chr21, as GFA. PGGB freeze1 publishes NO .gbz, .og
      or .snarls — GFA is the only form. The whole-genome file is 15.64 GB
      compressed / 86.5 GB raw; per-chromosome is both cheaper and what upstream
      used, since deconstruct is per-chromosome anyway.
    notes: >
      vg deconstruct is pipeline step 1. Our VCF will NOT match the published
      one: measured on chrY, vg 1.68 recovers 99.55% of the published VCF's
      sites by POS but only 92.7% by (POS, REF, ALT), concentrated at
      multi-allelic sites, because the published file was built with vg 1.36.
      Accepted deliberately. We must also apply chrX and chm13 removal
      ourselves — the published VCF carries 45 samples, we need 44.

  genetic_map:
    path: data/raw/chr21.b38.gmap
    source: SHAPEIT4 genetic_maps.b38.tar.gz (odelaneau/shapeit4 @ 43a9a497)
    corroborated_by: Beagle plink.GRCh38.map.zip — chr21 byte-identical
    bytes: 971965
    sha256: 95557a75b5851160ed4d7904b17d7718e62dc6f422614437870d6f2130d9d36d
    acquired: 2026-09-27
    what: >
      A DOWNLOADED table with cM already computed, not something estimated from
      our data. Columns pos / chr / cM, 44,618 rows. Provenance is HapMap Phase
      II lifted to GRCh38.
    span_bp:  [10326676, 46680243]
    span_cm:  [0.584144, 62.786478]
    notes: >
      Interpolate with numpy.interp, left=nan, right=nan — NEVER the default
      clamp — then assert no NaN survives the chain_span cut. Linear
      interpolation between markers is what Beagle, SHAPEIT4, hap-ibd and
      GLIMPSE all do; a cubic spline would be actively wrong (overshoot can
      produce negative genetic distance).

  target:
    # Supplied per run by preprocess-target, not by this manifest.
    # See target_selection below.
    path: null

  # NOT a mechanism input. The 1000 Genomes 30x GRCh38 panel serves two
  # EVALUATION-ONLY roles: it is where the stand-in test targets are drawn from,
  # and it is the attack database. Staged under our own data/raw/ rather than read
  # from inside PanMixer's checkout -- it is third-party data, not their artifact,
  # but the recipe should not point into their tree.
  external_panel_evaluation_only:
    path: data/raw/1000g_30x_phased.vcf.gz
    bytes: 427136458
    sha256: a925c112a1085faf01332bef0707b7f0304079fbd974a82de402d248037ea48b
    samples: 3202
    build: GRCh38
    url: https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/1000G_2504_high_coverage/working/20220422_3202_phased_SNV_INDEL_SV/1kGP_high_coverage_Illumina.chr21.filtered.SNV_INDEL_SV_phased_panel.vcf.gz
    note: >
      Phased and GRCh38-called, which is why a sample column IS a path once joined
      to our site list. 39 of the 44 HPRC donors are in it -- irrelevant to the
      mechanism, which never reads it, but it is why the attack database needs the
      cohort overlap removed before any privacy number is quoted.

# ---------------------------------------------------------------------------
# chain_span — the coordinate interval the chain actually runs over.
# Fixed BEFORE any target file is opened, so R_D stays a function of D alone.
#
# ⚠⚠ SUPERSEDED BY DECISION C (2026-10-08). READ THIS BEFORE USING THE BLOCK.
#
# Decision C: regions where the genetic map gives NO cM AT ALL are no longer
# EXCLUDED — they are SAMPLED UNDER A DECLARED CONSTANT RECOMBINATION RATE.
# This block is the machine-readable form of the policy that decision replaces,
# and it also supersedes deferred decision R2 (the provisional cut).
#
# It is RETAINED, not rewritten, because every artifact in data/cohort/chr21 was
# built under this cut (measured in_chain.sum() = 305,886) — so it stays the
# authority for what the chr21 numbers ON RECORD were measured under, and for
# nothing else. src/ still reads start/end until the preprocessing rerun.
#
# ⚠ THE RATE'S VALUE IS NOT CHOSEN, AND MUST NOT BE INVENTED HERE. Whether it is
#   one genome-wide constant or 22 per-chromosome values is equally open. Both
#   wait on a per-autosome map-coverage measurement that does not exist in this
#   repo yet (still-open question 1 in docs/plan.md): measure first, declare
#   second. The MECHANICS of applying the rate — where it is declared, how the
#   per-site cM source is recorded so the constant-rate share is reportable
#   rather than asserted — are implementation work, deliberately not specified.
#
# ⚠ SCOPE, AND IT IS NARROW. Decision C covers MAP-SILENT regions ONLY: the
#   positions with no cM at all, i.e. below the map's first marker and above its
#   last. INTERIOR ZERO-cM PLATEAUS INSIDE THE MAPPED SPAN ARE NOT OVERRIDDEN.
#   P(switch) = 0 between two variants with no genetic separation remains the
#   CORRECT model; docs/terms.md states it and tests/test_toy_enumeration.py
#   enforces it as a Theorem-1 SUPPORT property. Whether that is ever revisited
#   is a separate OPEN question, deferred until a per-autosome gap measurement
#   exists. Do not read decision C as touching it.
#
# ⚠ This manifest is chr21-only and decision D makes the product the 22
#   autosomes. Generalising it (one file per autosome, or one per-chromosome
#   section generated from a template so a value can only diverge deliberately)
#   is implementation work that has not been done.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE DECLARED CONSTANT RECOMBINATION RATE (decision C; value settled by Dylan
# 2026-10-10 after B-DAT-map-coverage measured what it applies to).
# ---------------------------------------------------------------------------
declared_rate:
  cM_per_Mb: 1.2707
  gap_table: data/raw/ucsc_gap/gap.txt.gz   # required whenever cM_per_Mb is set
  scope: genome          # ONE constant for all 22 autosomes, NOT per chromosome
  applies_to: map_silent # positions with NO cM at all: before the first marker
                         # or after the last. NOT the interior zero-cM plateaus.
  derivation: >
    The autosomal mean MAPPED rate: 3,543.8 cM of genetic length over 2,788.8 Mb
    of mapped span, measured across all 22 autosome maps by
    scripts/map_coverage.py on 2026-10-10 (logs/B_map_coverage.md).
  status: >
    ⚠ A DECLARED MODELLING CONVENTION, NOT AN ESTIMATE. It is applied where the
    map is silent precisely because no map speaks there; no measurement supports
    1.2707 for those regions specifically, and the biology says the opposite --
    deCODE's pedigree map assigns 0.0 cM/Mb to every 1 Mb bin from 0-13 Mb of
    chr21. Report it as a declaration and never as a measurement of the region.
  why_global_not_per_chromosome: >
    A per-chromosome rate is LESS defensible, which the coverage measurement
    reversed. 96% of the map-silent sequence is the five acrocentric p arms, and
    those five chromosomes have the HIGHEST mapped rates on the genome (chr22
    2.046, chr15 1.727, chr21 1.711 cM/Mb, all above the 1.2707 mean). An
    acrocentric's rate is measured ENTIRELY on its q arm, because the p arm is
    the region being filled -- so per-chromosome would extrapolate an unusually
    hot q-arm rate onto heterochromatin and rDNA, and would do so on exactly the
    chromosomes where the rule matters most. The per-chromosome spread is 1.84x.
  privacy_relevance: >
    NONE. The rate changes Delta_x, hence the switch mass, hence utility and
    realism. R_D stays target-independent under any rate, so Theorem 1 is
    untouched. This is a utility decision, not a privacy one.
  n_gap_policy: >
    ⚠⚠ UNDECLARED AND BLOCKED -- do not read the value above as settling it.
    A constant cM/Mb multiplied by FABRICATED base pairs yields fabricated cM,
    and GRCh38 chr21 5,010,000-10,814,560 is placeholder model sequence: 25
    contigs separated by fabricated N-gaps, 22 of them exactly 50 kb, so 1.1 Mb
    of the 10.33 Mb that the rate is about to be applied to on chr21 is gap
    rather than sequence. ✅ THE GAP COORDINATES ARE NOW ACQUIRED:
    data/raw/ucsc_gap/gap.txt.gz, the hg38 gap table, 12,368 B, 829 typed records.
    ⚠ CORRECTION 2026-10-10: this said "no FASTA, AGP or assembly report is on
    disk", which was WRONG -- external/PanMixer/starting_data/references/ holds
    chr21.fa and a full GRCh38 FASTA. The true statement was that none is staged
    in OUR tree, and CLAUDE.md forbids src/, configs/ and tests/ from reading
    inside PanMixer's tree. The gap table is the better artifact regardless:
    12 KB against 3.26 GB, and it gives typed gap records directly rather than
    requiring a scan for N-runs.
    ✅ MEASURED: 79.8% of the autosomal map-silent sequence is gap (68.8 of
    86.2 Mb), so accumulating the declared rate across it would assert 109.5 cM of
    which 87.4 cM sits on placeholder bp. And NO variant of ours falls inside any
    gap (chr21: 0 of 340,849), so skipping gap spans changes no position's chain
    membership and drops the map-silent distance from 109.5 cM to 22.1 cM.
    ⚠ THE POLICY IS STILL UNDECLARED. Until it is decided the
    implementation can only ACCUMULATE across the gaps -- that is now a pending
    decision rather than a missing input,
    and it must be stated in any writeup rather than left implicit.
  unmeasured: >
    The N-gap extent on the other 21 autosomes. chr21's 22x50 kb is the only
    figure on record.

chain_span:
  start: 12968320      # exclusive
  end:   46680243      # inclusive -- the genetic map's last marker
  keeps: 305886        # of OUR 340,849 chr21 records = 89.74%
  dropped_below: 34371
  dropped_above: 592
  status: superseded_by_decision_c   # 2026-10-08; was `provisional: true`
  superseded_note: >
    The flag this replaces read "Dylan to settle with his PI; this is the cut
    that lets v1 run". It is settled: not by moving the cut, but by replacing
    exclusion with a declared rate. Nothing in src/ ever read the flag, so it
    recorded the state of a conversation rather than gating anything.
  why_it_was_cut: >
    Below 12,968,320 the clamped interpolation and the map's own zero-cM
    centromeric plateau give 34,371 consecutive positions at IDENTICAL cM on OUR
    vg-1.68 build (34,345 on PanMixer's vg-1.36 build, which is the figure that
    stood here), so
    P(switch) = 0 and the sampler would emit one donor's real haplotype verbatim
    across 7.25 Mb. Five independent reasons supported the cut; see chain_span in
    docs/terms.md for the full table. The DEFECT is real and unchanged — what
    decision C changes is the REMEDY, from excluding the map-silent region to
    sampling it under a declared constant rate.
  resolved_by_decision_c:
    - >
      The positions below the map START (the map's first marker is 10,326,676)
      are map-silent — no cM at all — so under decision C they get the declared
      constant rate and are INCLUDED, not cut. ⚠ Two different counts, do not
      conflate them: 34,371 positions fall below the CUT at 12,968,320, and the
      count below the MAP START is smaller. ⚠ CORRECTED 2026-10-10 — an earlier
      version of this block said the map-start count "has NOT been re-measured on
      ours". It HAS: docs/terms.md records the split as 34,371 = 26,044 NaN below
      the map start (OUR 340,849-record build) plus 8,327 on the map's zero-cM
      centromeric plateau, all at cM 0.584144 exactly. The 26,018 in docs/data.md
      is PanMixer's 340,824-record build; 26,044 is ours. So on chr21 the quantity
      the declared rate applies to is 26,044 positions, measured. What still needs
      measuring is the same split on the other 21 autosomes.
    - >
      The 592 variants ABOVE the map end (46,680,243 vs positions to
      46,699,788), a 593-position zero-distance run, are map-silent too, so they
      are INCLUDED under the same declared rate. This supersedes BOTH earlier
      positions on them: the "UNDECIDED — do not clamp it silently" that stood
      here, and the 2026-09-29 telomeric CUT recorded in the chain_span entry of
      docs/terms.md. The two documents disagreed; decision C settles it in the
      direction of neither cutting nor clamping.
  residual_needing_a_decision:
    - >
      ⚠ FLAGGED 2026-10-08, NOT RESOLVED, AND IT NEEDS DYLAN. The cut at
      12,968,320 sits ABOVE the map's first marker at 10,326,676, so the stretch
      between them is INSIDE the mapped span: the map gives cM there, and the
      reason the cut reached that far is that those cM values are IDENTICAL — the
      map's own zero-cM centromeric plateau. That makes it an INTERIOR plateau,
      which decision C explicitly does NOT override. Decision C supersedes R2, so
      the cut is no longer policy and those positions come back into the chain
      with P(switch) = 0 — i.e. the verbatim-emission defect the cut was created
      to prevent returns for exactly the in-span portion, because the declared
      rate does not reach it and the plateau rule says leave it.
      ⚠ CORRECTED 2026-10-10: this said the split was UNMEASURED. On chr21 it is
      measured — 34,371 = 26,044 below the map start (map-silent, the declared
      rate applies) + 8,327 on the in-span zero-cM plateau (it does not). So the
      residual has a size: 8,327 chr21 positions, all at cM 0.584144, come back
      into the chain with P(switch) = 0 and will be emitted as a verbatim donor
      run. That is 2.7% of a 305,886-position chain. Still needs Dylan, and still
      must not be written as decided — but it is a known quantity, not an unknown.
      The same split on the other 21 autosomes IS unmeasured and is B-DAT-map-coverage.
  not_overridden_by_decision_c:
    - >
      618 interior map intervals have dcM = 0 over 2.71 Mb, holding ~1,650 kept
      variants. These are REAL map plateaus; P(switch) = 0 between two variants
      with no genetic separation is CORRECT. This position STANDS — decision C
      does not touch it. ⚠ But 2.71 Mb is a chr21-ONLY figure: the 22-autosome
      extent of interior zero-cM intervals is UNMEASURED, so it must not be
      quoted genome-wide. Measure it per autosome before the deferred question
      "are interior plateaus eventually overridden" can be answered either way.

# ---------------------------------------------------------------------------
# Target selection — for testing, until a real external target is available.
# ---------------------------------------------------------------------------
target_selection:
  method: held-out sample from the 1000 Genomes 30x GRCh38 panel
  rationale: >
    Standard practice, and already used in this project: the 2026-09-27
    representability measurement used six 1000G samples outside the HPRC 44 as
    stand-in external targets. The panel is phased and GRCh38-called, so a
    sample column IS a path once joined to our site list — which is exactly the
    target format the pipeline wants, and it avoids vg giraffe entirely (HPRC
    marks short-read mapping "untested" for the PGGB graph).

  eligibility:                      # ALL must hold
    - in the 3,202-sample 30x panel
    - NOT one of the 44 HPRC cohort members          # 39 of 44 are in the panel
    - NOT a first-degree relative of any HPRC member # 78 such samples
    - excluded from the attack database at evaluation time

  pool: configs/clean_pool.chr21.txt          # 1,399 samples -- USE THIS ONE
  wide_pool: configs/eligible_targets.chr21.txt  # 3,085, HPRC-relatedness only
  pool_derivation: >
    3202 - 39 (HPRC members in panel) - 78 (1st-degree relatives of HPRC) = 3085,
    then - 1686 that have a first-degree relative ANYWHERE in the 3,202 = 1399.
    The last rule matters because if a target's own parent or child sits in the
    ATTACK DATABASE, the attack can match the relative instead of the target,
    which confounds the measurement in the optimistic direction. 55% of the wide
    pool fails it.

  relatedness_warning: >
    NOT a formality. The 39 HPRC donors present in the 30x panel are the
    CHILDREN of trios, and their 78 parents are in the unrelated-2504 set — so a
    target picked at random from the 2504 has a ~3.1% chance of being the parent
    of a cohort member, sharing about half its genome with a donor haplotype.
    That would inflate apparent fidelity and confound the privacy measurement.
    The pool above already excludes them.

  selected: configs/targets.chr21.txt    # the 10 test targets, extracted 2026-09-29
  selection_method: >
    Two per super-population, all from the strict 1,399 pool. HG00096 and HG00097
    carried over from the 2026-09-27 representability run for continuity; the
    other eight drawn with random.Random(20260929) so the choice is reproducible.
    Spread is deliberate -- the HPRC cohort is multi-continental, so a target's
    ancestry relative to the cohort should strongly affect how well a mosaic of
    cohort haplotypes reproduces it, and an all-GBR set would hide that.
  selected_detail:   # sample: [super_pop, pop, chr21 non-ref calls]
    HG00096: [EUR, GBR, 61495]
    HG00097: [EUR, GBR, 60677]
    HG01323: [AMR, PUR, 61831]
    HG01468: [AMR, CLM, 59953]
    HG02389: [EAS, CDX, 59944]
    HG03757: [SAS, STU, 64279]
    HG04211: [SAS, ITU, 64515]
    NA19056: [EAS, JPT, 59421]
    NA19350: [AFR, LWK, 78744]
    NA20294: [AFR, ASW, 79217]
  sanity_check: >
    Non-reference counts run 59,421 (NA19056, EAS) to 79,217 (NA20294, AFR) --
    the AFR samples carry the most, as expected from African populations' higher
    diversity. A useful smoke test that the spread is real.

  ceiling: >
    A held-out panel sample UNDERSTATES the representability problem. Measured
    2026-09-27 on these six: ~80.4% of a target's chr21 non-reference calls have
    an exact record in the graph; 9.9% have no record at all and carry 20.5% of
    the target's -log f information. That 9.9% is a LOWER bound, because a 1000G
    sample's variants are by construction already catalogued — a genuinely novel
    genome would fare worse. Report target_fidelity against this ceiling, always.

# ---------------------------------------------------------------------------
# Deliberately NOT inputs. Recorded so the absences are decisions, not oversights.
# ---------------------------------------------------------------------------
not_used:
  pangenie_callset: >
    Fed only the anchor set and one allele-frequency branch, both deleted by
    model C. No evaluator reads it. Saves a 5.06 GB download.
  external_panel_for_mechanism: >
    Fed only the PLINK LD block boundaries, which model C does not use. The
    panel survives ONLY as the attack database in the evaluation, where cohort
    overlap must be removed before it is loaded. NOTE the obvious removal is
    incomplete: all 39 HPRC overlaps sit in the 698 samples the 30x release
    ADDED beyond Phase 3 to complete trios, so dropping those 39 leaves their
    78 first-degree relatives in the database.
  allele_frequency_table: >
    No privacy score and no allele-frequency sampling branch to feed. Note that
    support(v) needs no computation either: INFO/AN in the graph VCF is
    bit-identical to the non-missing count across all 340,849 chr21 records of
    OUR vg-1.68 build (verified on ours, 2026-09-29; the 340,824 that stood here
    is PanMixer's vg-1.36 count, and the identity was first measured on theirs).
    ⚠ The same stale 340,824 still sits in src/cohort/support.py as if it
    described our build.

# ---------------------------------------------------------------------------
# Attack database -- EVALUATION ONLY, never an input to the mechanism.
# ---------------------------------------------------------------------------
attack_database:
  path: data/attack/1000g_30x_chr21_attackdb.vcf.gz
  built: 2026-09-29
  samples: 3192                      # 3,202 minus the 10 test targets
  excluded: data/attack/excluded_targets.txt
  why_exclude_targets: >
    The gap score is self minus the maximum over the database. If the target is
    in the database it is its own rank-1 hit and the gap is trivially zero --
    PanMixer's departure (e). The target's true path is the "self" reference; the
    database supplies the COMPETING candidates.

  open_question_hprc_members: >
    39 HPRC cohort members are STILL in this database, deliberately, because the
    right answer is not obvious and belongs in a threat-model conversation.
    The release is a mosaic of cohort haplotypes, so it will match cohort members
    well -- but that identifies DONORS, not the target. Leaving them in inflates
    max(others), shrinks the gap, and makes privacy look BETTER, which is the
    dangerous direction. Removing them makes the attack stronger and is the
    conservative choice. Rebuild without them (and without their 78 first-degree
    relatives, which is the part an obvious fix misses) before quoting any
    privacy number.
